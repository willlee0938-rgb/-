t:700;box-shadow:0 5px 13px #2563eb1c}.btn.secondary{background:#edf4ff;color:#1e5bb3;box-shadow:none}.btn.danger{background:#fff0f1;color:#c5354a;box-shadow:none}.btn:disabled{opacity:.5}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:690px}th,td{text-align:left;border-bottom:1px solid #e9eef5;padding:15px 10px;font-size:13px}th{color:#788aa2;font-weight:700;background:#f8faff}td{color:#233956}.pill{padding:6px 10px;border-radius:20px;background:#e8f4ff;color:#1764b4;font-size:12px;white-space:nowrap;font-weight:650}.bar{height:9px;background:#eaf0f8;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#2477f2,#19c5ac);border-radius:10px}.barrow{margin:15px 0}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:#425773}.empty{padding:36px;text-align:center;color:#9cacc5}.hint{font-size:12px;color:#8695a9;margin-top:12px;line-height:1.7}.modalback{position:fixed;inset:0;background:#09172cc7;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{background:white;border:1px solid #dce7f4;border-radius:20px;padding:26px;width:min(560px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#566981}.field.wide{grid-column:1/-1}.field input,.field select{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{background:#e9f5ff;border:1px solid #cde6fc;padding:13px 16px;border-radius:12px;color:#37648d;font-size:13px;margin-bottom:19px;line-height:1.6}.statline{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #edf0f5;font-size:13px;color:#425673}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{flex:1}.hidden{display:none!important}.hero{background:linear-gradient(112deg,#102f67 0%,#155ad2 55%,#06a6a5 100%);border-radius:22px;color:white;padding:30px 33px;margin-bottom:20px;position:relative;overflow:hidden;min-height:170px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 13px 32px #1e61b02b}.hero:after{content:"";position:absolute;right:-45px;top:-80px;width:300px;height:300px;border:55px solid #ffffff16;border-radius:50%}.hero h2{font-size:27px;color:white;margin:0 0 9px}.hero p{color:#d8ebff;line-height:1.7}.hero .btn{background:white;color:#1358b7;box-shadow:none;z-index:1}.hero small{display:block;color:#8ef6e6;font-weight:800;letter-spacing:2px;margin-bottom:10px}.card:has(.metric){border-top:4px solid #2d7af2}.card:has(.metric):nth-child(2){border-top-color:#14b8a6}.card:has(.metric):nth-child(3){border-top-color:#f59e0b}.card:has(.metric):nth-child(4){border-top-color:#8056ed}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){aside{position:static;width:auto;padding:12px;display:flex;gap:4px;overflow:auto;align-items:center;border-right:0;border-bottom:1px solid #27334a}.brand{font-size:18px;padding:8px;white-space:nowrap}.nav{width:auto;white-space:nowrap;font-size:12px;padding:9px}main{margin:0;padding:17px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.metric{font-size:23px}.top{align-items:flex-start}.formgrid{grid-template-columns:1fr}.hero{padding:22px;min-height:150px}.hero h2{font-size:21px}.hero .btn{font-size:12px}}

rc="publishing-workflow.js"></script><script src="broker-ui.js"></script><script src="assets/publishing.js"></script><script src="ad-factory-ui.js"></script><script src="owner-workspace.js"></script><script>
const demoCarImage=(color)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#dceeff"/><stop offset="1" stop-color="#f7fafc"/></linearGradient></defs><rect width="640" height="400" fill="url(#bg)"/><path d="M0 302H640" stroke="#b4c9df" stroke-width="4"/><path d="M108 247L167 227L220 166Q240 150 278 150H408Q432 150 455 181L492 227L536 240Q555 246 555 264V292H92V270Q92 252 108 247Z" fill="${color}" stroke="#243a50" stroke-width="8"/><path d="M238 167H405Q427 167 443 192L466 226H185Z" fill="#a6d9ef" stroke="#243a50" stroke-width="6"/><path d="M326 168V227" stroke="#243a50" stroke-width="6"/><circle cx="194" cy="290" r="40" fill="#263548"/><circle cx="194" cy="290" r="20" fill="#dce6f0"/><circle cx="464" cy="290" r="40" fill="#263548"/><circle cx="464" cy="290" r="20" fill="#dce6f0"/><text x="320" y="355" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#486581">示意圖・非實車照片</text></svg>`);const $=s=>document.querySelector(s);const key='driveos_v1';const demo={cars:[{id:'CAR-001',brand:'Toyota',model:'Altis',year:2018,mileage:89000,price:328000,status:'可售',image:demoCarImage('#2773b8'),notes:'示範資料，非真實庫存'},{id:'CAR-002',brand:'Honda',model:'Fit',year:2019,mileage:65000,price:358000,status:'可售',image:demoCarImage('#ed7c43'),notes:'示範資料，非真實庫存'},{id:'CAR-003',brand:'Mazda',model:'Mazda3',year:2020,mileage:53000,price:568000,status:'待確認',image:demoCarImage('#4e647b'),notes:'示範資料，非真實庫存'}],leads:[{id:'LEAD-001',name:'示範客戶阿哲',contact:'Messenger',source:'Facebook社團',budget:300000,interest:'Toyota Altis',stage:'需求確認',notes:'2017年後，通勤代步；示範資料',created:'2026-10-14'}],posts:[{id:'POST-001',platform:'Threads',title:'30萬預算中古車怎麼挑？',status:'草稿',views:0,inquiries:0,date:'2026-10-14',content:'預算30萬，買中古車你最在意年份、里程還是車況？'}],deals:[],settings:{name:'我的汽車銷售工作台',partner:'合作車行（待設定）'}};let db=DriveOSData.initialState(demo);for(const k of ['cars','leads','posts','deals'])if(!Array.isArray(db[k]))db[k]=[];let page=new URLSearchParams(location.search).get('view')==='adFactory'?'adFactory':'dashboard',filter='',brandFilter='',editing=null;const names={ownerLeads:'買賣線索',adFactory:'廣告工廠',publishing:'審核與發布工作台',examples:'廣告範例',inventoryImport:'車源匯入',broker:'遠端媒合中心',dashboard:'今日總覽',cars:'車源管理',leads:'客戶 CRM',posts:'社群廣告管理',deals:'轉介與佣金',reports:'數據分析',settings:'系統設定'};const descriptions={ownerLeads:'買家與賣家需求統一追蹤',adFactory:'一台車一列・右側查看 FB / Threads 四篇文案',publishing:'圖文審核、社團清單與逐站發布進度',examples:'5組示範車源，對照Facebook與Threads廣告文案',inventoryImport:'先預覽、再確認，更新車源並保留客戶資料',broker:'車源廣告、發布提醒、車行交接與成交佣金',dashboard:'車源、廣告審核與買賣線索的每日重點',cars:'管理車款、庫存與報價',leads:'從詢問到賞車的客戶追蹤',posts:'Facebook / Threads 免費內容管理',deals:'追蹤轉介、成交及佣金',reports:'追蹤銷售轉換與來源表現',settings:'資料備份、匯入與未來介接'};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');const save=()=>{try{DriveOSData.persist(db);return true}catch(e){db=DriveOSData.snapshot();alert('儲存失敗：'+e.message);return false}};const uid=p=>p+'-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();const btn=(text,fn,cl='secondary')=>`<button class="btn ${cl}" onclick="${fn}">${text}</button>`;const count=(a,k,v)=>a.filter(x=>x[k]===v).length;const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);function navigate(p){page=p;filter='';brandFilter='';render()};const mainPages=['dashboard','cars','adFactory','ownerLeads','settings'];function render(){BrokerUI.reconcile();DriveOSData.refreshStatus();document.querySelector('#nav').innerHTML=mainPages.map(k=>[k,names[k]]).map(([k,v])=>`<button class="nav ${page===k?'active':''}" onclick="navigate('${k}')">${({ownerLeads:'♙',adFactory:'▤',publishing:'➤',examples:'✦',inventoryImport:'⇧',broker:'↗',dashboard:'◫',cars:'🚘',leads:'♙',posts:'▤',deals:'◇',reports:'▥',settings:'⚙'})[k]}　${v}</button>`).join('');$('#heading').textContent=names[page];$('#subheading').textContent=descriptions[page];$('#app').innerHTML=({ownerLeads:()=>OwnerUI.leads(db),dashboard:()=>OwnerUI.dashboard(db),settings:()=>OwnerUI.settings(db,settings),adFactory:AdFactoryUI.workspace,publishing:publishingWorkspace,examples:adExamplesWorkspace,inventoryImport:inventoryWorkspace,broker:brokerWorkspace,cars:cars,leads:leads,posts:posts,deals:deals,reports:reports})[page]();void DriveOSPhotos.refresh()}function metric(label,value,detail){return `<div class="card"><div class="muted">${label}</div><div class="metric">${value}</div><div class="muted">${detail}</div></div>`}function dashboard(){const sold=db.deals.filter(x=>x.status==='已成交');const expected=sum(sold,'commission');return `<div class="hero"><div><small>DRIVEOS / SALES COMMAND CENTER</small><h2>讓每一筆流量，成為下一筆成交。</h2><p>車源・客戶・社群內容・轉介佣金，一站掌握。<br>今天就從一位新客戶開始。</p></div><button class="btn" onclick="openForm('leads')">＋ 建立新客戶</button></div><div class="notice">${DriveOSData.isCloud()?'目前使用雲端帳號，請以上方同步狀態確認資料是否已存入雲端。':'目前為示範本機模式，資料只存在這個瀏覽器，請定期匯出備份。'}示範車輛與客戶並非凱爾車業真實資料。</div><div class="grid">${metric('庫存車輛',db.cars.length+' 台','包含待確認車源')}${metric('客戶名單',db.leads.length+' 人','各平台匯集')}${metric('已成交轉介',sold.length+' 筆','依手動紀錄')}${metric('成交佣金',money(expected),'非實際入帳金額')}</div><div class="two section"><div class="card"><h2>銷售漏斗</h2>${['新詢問','需求確認','已推薦車源','已預約賞車','已轉介','已成交','未成交'].map(s=>`<div class="barrow"><div class="barhead"><span>${s}</span><span>${count(db.leads,'stage',s)}</span></div><div class="bar"><div style="width:${db.leads.length?100*count(db.leads,'stage',s)/db.leads.length:0}%"></div></div></div>`).join('')}</div><div class="card"><h2>快速操作</h2><div class="quick">${btn('＋ 新增客戶',"openForm('leads')",'')}${btn('＋ 新增車源',"openForm('cars')",'')}${btn('＋ 社群貼文',"openForm('posts')",'')}${btn('＋ 新增轉介',"openForm('deals')",'')}</div><h2 style="margin-top:26px">工作提醒</h2><div class="statline"><span>待確認庫存</span><b>${count(db.cars,'status','待確認')} 台</b></div><div class="statline"><span>未結案客戶</span><b>${db.leads.filter(x=>!['已成交','未成交'].includes(x.stage)).length} 人</b></div><div class="statline"><span>待發布貼文</span><b>${count(db.posts,'status','草稿')} 篇</b></div><div class="statline"><span>待結算佣金</span><b>${db.deals.filter(x=>x.status==='已成交'&&x.paid!=='已入帳').length} 筆</b></div></div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">目前沒有資料</td></tr>`}</tbody></table></div>`}function inventoryBrands(){const brands=new Map();for(const car of db.cars){const label=String(car.brand||'').trim();const key=label.toLocaleLowerCase();if(label&&!brands.has(key))brands.set(key,label)}return [...brands].sort((a,b)=>a[1].localeCompare(b[1],'zh-TW'))}function resetInventoryFilters(){filter='';brandFilter='';render()}function inventoryMatches(x){return (!brandFilter||String(x.brand||'').trim().toLocaleLowerCase()===brandFilter)&&matching(x)}function searchbar(p){if(p==='cars'){const brands=inventoryBrands();if(brandFilter&&!brands.some(([key])=>key===brandFilter))brandFilter='';return `<div class="toolbar"><label style="display:flex;align-items:center;gap:8px">品牌<select aria-label="車子品牌" onchange="brandFilter=this.value;refreshTable()"><option value="">全部品牌</option>${brands.map(([key,label])=>`<option value="${esc(key)}" ${key===brandFilter?'selected':''}>${esc(label)}</option>`).join('')}</select></label><input aria-label="搜尋車源" style="flex:1;min-width:190px" placeholder="搜尋車型、年份、車源編號..." value="${esc(filter)}" oninput="filter=this.value;refreshTable()"><button type="button" class="btn secondary" onclick="resetInventoryFilters()">清除篩選</button>${btn('＋ 新增',"openForm('cars')",'')}</div>`}return `<div class="toolbar"><input style="flex:1;min-width:190px" placeholder="搜尋資料..." value="${esc(filter)}" oninput="filter=this.value;refreshTable()">${btn('＋ 新增',`openForm('${p}')`,'')}</div>`}function refreshTable(){const input=document.querySelector('.toolbar input');if(input)filter=input.value;let fresh=({cars:cars,leads:leads,posts:posts,deals:deals})[page]();const doc=new DOMParser().parseFromString(fresh,'text/html');for(const selector of page==='cars'?['.cargrid','#inventory-result-count']:['.tablewrap']){const next=doc.querySelector(selector),old=$(selector);if(next&&old)old.replaceWith(next)}if(page==='cars')void DriveOSPhotos.refresh()}function matching(x){return Object.values(x).join(' ').toLowerCase().includes(filter.toLowerCase())}function controls(p,id){const item=db[p].find(x=>x.id===id);if(item?.workflow&&['posts','deals'].includes(p))return `<button class="btn secondary" onclick="navigate('broker')">前往媒合流程</button>`;return `<button class="btn secondary" onclick="openForm('${p}','${esc(id)}')">編輯</button> <button class="btn danger" onclick="removeItem('${p}','${esc(id)}')">刪除</button>`}function carImage(x){const src=DriveOSPhotos.cover(x)||demoCarImage('#6987a6');return `<img data-storage-path="${esc(DriveOSPhotos.coverPath(x))}" src="${esc(src)}" alt="${esc(x.brand)} ${esc(x.model)} 車輛圖片" loading="lazy" onerror="this.onerror=null;this.src=demoCarImage('#6987a6')">`}function cars(){return `<div class="card"><h2>車源圖庫</h2><p class="hint">每台車都有圖片。示範車輛使用插畫，非實車照片；可編輯車輛上傳圖片或填入圖片網址。未來匯入資料時支援 image / imageUrl / images 欄位。</p>${searchbar('cars')}<p id="inventory-result-count" class="hint" role="status" aria-live="polite">顯示 ${db.cars.filter(inventoryMatches).length} / ${db.cars.length} 台車源</p><div class="cargrid">${db.cars.filter(inventoryMatches).map(x=>`<article class="carcard"><div class="carphoto">${carImage(x)}<span class="carstatus">${esc(x.status)}</span></div><div class="carbody"><div class="carname">${esc(x.brand)} ${esc(x.model)}</div><div class="muted">${esc(x.year)} 年 · ${Number(x.mileage||0).toLocaleString()} km</div><div class="carprice">${money(x.price)}</div><div class="muted">${esc(x.id)}</div><div class="caractions">${controls('cars',x.id)}<button type="button" class="btn secondary" data-publish-action="open-vehicle" data-id="${esc(x.id)}">準備廣告</button><button type="button" class="btn secondary" data-photo-action="open" data-car-id="${esc(x.id)}">照片管理</button></div></div></article>`).join('')||(db.cars.length?'<div class="empty">沒有符合條件的車源，請更換品牌、關鍵字或清除篩選。</div>':'<div class="empty">目前沒有車輛，點選「新增」建立車源</div>')}</div></div>`}function leads(){return `<div class="card"><h2>客戶管理</h2>${searchbar('leads')}${table(['客戶','來源','購車預算','意向車款','銷售階段','操作'],db.leads.filter(matching).map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.contact)}</div></td><td>${esc(x.source)}</td><td>${money(x.budget)}</td><td>${esc(x.interest)}</td><td><span class="pill">${esc(x.stage)}</span></td><td>${controls('leads',x.id)}</td></tr>`).join(''))}<p class="hint">客戶資料請取得必要同意後再分享給車行，不要在備註儲存身分證號、財力證明等敏感資訊。</p></div>`}function posts(){return `<div class="card"><h2>FB / Threads 發文工作台</h2>${searchbar('posts')}${table(['平台','主題','日期','狀態','瀏覽','詢問','操作'],db.posts.filter(matching).map(x=>`<tr><td>${esc(x.platform)}</td><td><b>${esc(x.title)}</b><div class="muted">${esc(x.content).slice(0,55)}</div></td><td>${esc(x.date)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${Number(x.views||0)}</td><td>${Number(x.inquiries||0)}</td><td>${controls('posts',x.id)} <button class="btn secondary" onclick="copyPost('${esc(x.id)}')">複製</button></td></tr>`).join(''))}<p class="hint">免費社群貼文成效需手動填入；目前沒有自動連接 Meta / Threads 數據。</p></div>`}function deals(){return `<div class="card"><h2>轉介與佣金追蹤</h2>${searchbar('deals')}${table(['客戶','車款','轉介日期','狀態','預計佣金','入帳','操作'],db.deals.filter(matching).map(x=>`<tr><td>${esc(x.customer)}</td><td>${esc(x.car)}</td><td>${esc(x.date)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${money(x.commission)}</td><td>${esc(x.paid)}</td><td>${controls('deals',x.id)}</td></tr>`).join(''))}<p class="hint">佣金以合作約定及車行確認為準，預計佣金不代表已收款。</p></div>`}function reports(){let sources={};db.leads.forEach(x=>sources[x.source]=(sources[x.source]||0)+1);const entries=Object.entries(sources);const max=Math.max(1,...entries.map(x=>x[1]));const sold=db.deals.filter(x=>x.status==='已成交');const paid=db.deals.filter(x=>x.paid==='已入帳');const views=sum(db.posts,'views'),inq=sum(db.posts,'inquiries');return `<div class="grid">${metric('客戶總數',db.leads.length,'CRM 名單')}${metric('轉介成交率',db.deals.length?(sold.length/db.deals.length*100).toFixed(1)+'%':'—','成交數 / 轉介紀錄數')}${metric('已入帳佣金',money(paid.reduce((total,item)=>total+Number(item.confirmedCommission??item.commission??0),0)),'手動標記')}${metric('社群詢問率',views?(inq/views*100).toFixed(1)+'%':'—','詢問數 / 瀏覽數')}</div><div class="two section"><div class="card"><h2>客戶來源分布</h2>${entries.length?entries.map(([k,v])=>`<div class="barrow"><div class="barhead"><span>${esc(k)}</span><span>${v} 人</span></div><div class="bar"><div style="width:${v/max*100}%"></div></div></div>`).join(''):'<div class="empty">新增客戶後顯示來源分析</div>'}</div><div class="card"><h2>社群成效比較</h2>${['Facebook社團','Facebook個人','Threads','其他'].map(platform=>{let a=db.posts.filter(x=>x.platform===platform);return `<div class="statline"><span>${platform}</span><span>${sum(a,'views')} 瀏覽 / ${sum(a,'inquiries')} 詢問</span></div>`}).join('')}<p class="hint">數據依手動紀錄計算；尚未支援歸因分析或平台自動回傳。</p></div></div>`}function settings(){return `<div class="two"><div class="card"><h2>資料管理</h2><p style="margin-bottom:16px">${DriveOSData.isCloud()?'目前使用雲端儲存；還原備份會覆蓋此帳號的整個工作台，請先下載現有資料。':'目前儲存於此裝置的瀏覽器，請定期下載 JSON 備份。'}</p><div class="quick">${btn('下載 JSON 備份','exportJSON()','')}${btn('匯入 JSON 備份',"document.getElementById('importfile').click()")}${btn('清空工作台資料','clearDemo()','danger')}</div><input type="file" id="importfile" accept=".json,application/json" style="display:none" onchange="importJSON(event)"><p class="hint">匯入備份會覆蓋目前全部資料。車源檔請到「車源匯入」預覽後匯入；此處用於整站備份還原。尚未連線車行網站。</p></div><div class="card"><h2>合作車行介接（預留）</h2><div class="statline"><span>資料來源</span><b>尚未連接</b></div><div class="statline"><span>同步狀態</span><b>手動管理</b></div><div class="statline"><span>正式帳號系統</span><b>${DriveOSData.isCloud()?'已連接':'尚未設定'}</b></div><div class="statline"><span>雲端資料庫</span><b>${DriveOSData.isCloud()?'已連接，以上方同步狀態為準':'尚未設定'}</b></div><p class="hint">取得朋友授權的 API、JSON、CSV 或網站原始碼後，再規劃資料同步。請勿在此輸入任何密碼或 API 金鑰。</p></div></div>`}
const fields={cars:[['brand','品牌','text'],['model','車型','text'],['year','年份','number'],['mileage','里程（公里）','number'],['price','售價（元）','number'],['status','庫存狀態','select','可售|待確認|已售出|暫停刊登'],['image','車輛主圖網址（或使用下方上傳）','text'],['notes','備註','textarea']],leads:[['intent','需求類型','select','想買車|想賣車'],['name','客戶稱呼','text'],['contact','聯絡管道 / ID','text'],['source','客戶來源','select','Facebook社團|Facebook個人|Threads|朋友介紹|其他'],['budget','預算（元）','number'],['interest','意向車款','text'],['stage','銷售階段','select','新詢問|需求確認|已推薦車源|已預約賞車|已轉介|已成交|未成交'],['notes','需求與跟進備註','textarea']],posts:[['platform','平台','select','Facebook社團|Facebook個人|Threads|其他'],['title','貼文主題','text'],['date','日期','date'],['status','狀態','select','草稿|待審核|已核准|已排程|已發布|已取消'],['views','瀏覽數','number'],['inquiries','詢問數','number'],['content','貼文內容','textarea']],deals:[['customer','客戶名稱','text'],['car','車款','text'],['date','轉介日期','date'],['status','成交狀態','select','已轉介|賞車中|已到店|已成交|未成交'],['commission','預計佣金（元）','number'],['paid','佣金入帳','select','未入帳|已入帳'],['notes','轉介紀錄','textarea']]};function openForm(p,id){editing={p,id};uploadedCarImage=null;let item=db[p].find(x=>x.id===id)||{};$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeForm()"><div class="modal"><h2>${id?'編輯':'新增'}${names[p]}</h2><form id="entryform" onsubmit="submitForm(event)"><div class="formgrid">${fields[p].map(([k,label,type,opts])=>`<label class="field ${type==='textarea'?'wide':''}"><span>${label}</span>${type==='select'?`<select name="${k}">${opts.split('|').map(v=>`<option value="${esc(v)}" ${item[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${k}">${esc(item[k])}</textarea>`:`<input name="${k}" type="${type}" ${type==='number'?'min="0"':''} value="${esc(item[k]??(type==='date'?new Date().toLocaleDateString('en-CA'):''))}" ${['name','brand','model','title','customer'].includes(k)?'required':''}>`}</label>`).join('')}</div>${p==='cars'&&DriveOSData.isCloud()?'<p class="hint">實車照片請先儲存車源，再點車卡上的「照片管理」上傳雲端圖庫。</p>':''}${p==='cars'&&!DriveOSData.isCloud()?`<div class="uploadarea"><label class="field"><span>從電腦上傳車輛照片（建議小於 1MB）</span><input type="file" id="carfile" accept="image/jpeg,image/png,image/webp" onchange="previewCarUpload(event)"></label><p class="hint">圖片會轉成資料網址保存在本機瀏覽器。大圖或大量照片建議未來使用雲端圖庫。</p><img id="carpreview" src="${esc(item.image||demoCarImage('#6987a6'))}" alt="車輛預覽"></div>`:''}<div class="actions">${btn('取消','closeForm()') }<button class="btn" type="submit">儲存資料</button></div></form></div></div>`}let uploadedCarImage=null;function previewCarUpload(e){const file=e.target.files[0];if(!file)return;if(file.size>1300000){alert('圖片超過 1.3MB，請先壓縮後上傳，避免瀏覽器儲存空間不足');e.target.value='';return}const r=new FileReader();r.onload=()=>{uploadedCarImage=r.result;const preview=document.getElementById('carpreview');if(preview)preview.src=uploadedCarImage};r.readAsDataURL(file)}function closeForm(){$('#modalroot').innerHTML='';editing=null}function submitForm(e){e.preventDefault();let {p,id}=editing;let obj={id:id||uid(p.toUpperCase().slice(0,-1))};new FormData(e.target).forEach((v,k)=>obj[k]=['year','mileage','price','budget','views','inquiries','commission'].includes(k)?Number(v||0):String(v));if(p==='cars'){if(uploadedCarImage)obj.image=uploadedCarImage;else if(!obj.image)obj.image=demoCarImage('#6987a6');const prior=db.cars.find(c=>c.id===id);if(prior?.images?.length&&obj.image&&obj.image!==prior.image&&!obj.image.startsWith('data:image/svg+xml')){const rest=VehiclePhotos.gallery(prior).filter(image=>image.url!==obj.image);if(rest.length>=20){alert('每台車最多20張照片，請先到照片管理移除照片');return}if(DriveOSData.isCloud()&&!obj.image.startsWith('https://')){alert('請填HTTPS照片網址，或使用照片管理上傳雲端');return}obj.images=VehiclePhotos.setGallery(prior,[{url:obj.image},...rest]).images}}if(p==='leads'&&!id)obj.created=new Date().toLocaleDateString('en-CA');let i=db[p].findIndex(x=>x.id===id);if(i>=0)db[p][i]={...db[p][i],...obj};else db[p].unshift(obj);if(!save())return;closeForm();render()}function removeItem(p,id){if(!confirm('確定刪除這筆資料？此動作無法復原。'))return;db[p]=db[p].filter(x=>x.id!==id);save();render()}async function copyPost(id){const item=db.posts.find(x=>x.id===id);if(!item)return;if(item.workflow&&item.status!=='已發布'){const blocker=DriveOSWorkflow.reason(db,item);if(blocker){alert(blocker);return}}try{await navigator.clipboard.writeText(item.content);alert('貼文已複製')}catch(e){prompt('請手動複製貼文：',item.content)}}function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='driveos-backup-'+new Date().toLocaleDateString('en-CA')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importJSON(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!['cars','leads','posts','deals'].every(k=>Array.isArray(data[k])))throw Error('格式不符');data.cars=data.cars.map(c=>({...c,image:c.image||c.imageUrl||(Array.isArray(c.images)?c.images[0]:null)||demoCarImage('#6987a6')}));if(!confirm('匯入會覆蓋目前所有資料，確定繼續？'))return;db=data;if(!save())return;render();alert('資料匯入已保留，雲端模式請確認同步狀態')}catch(err){alert('無法匯入：'+err.message)}};reader.readAsText(file)}function clearDemo(){if(!confirm('確定清空目前工作台的全部車源、客戶、貼文與成交資料？雲端模式也會同步清空，請先下載備份！'))return;db={cars:[],leads:[],posts:[],deals:[],settings:{}};save();render()}render();
window.DriveOSApp={replaceState(next){db=next;closeForm();render()},snapshot:()=>structuredClone(db)};DriveOSData.start();
</script></body></html>
